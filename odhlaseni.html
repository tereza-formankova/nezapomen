<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odhlášení – Nezapomeň</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f6b6b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎁%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:"Inter Variable";font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-ext-wght-normal.woff2) format("woff2-variations");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Inter Variable";font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Fraunces Variable";font-display:swap;font-weight:100 900;src:url(fonts/fraunces-latin-ext-wght-normal.woff2) format("woff2-variations");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Fraunces Variable";font-display:swap;font-weight:100 900;src:url(fonts/fraunces-latin-wght-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--ink:#1c2233;--paper:#fbfaf8;--teal:#0f6b6b;--tealsoft:#e3f2f1;--ribbon:#c2255c;--ribbonsoft:#fde8ec;--mute:#4f566a;--line:#dfe2e8;--field:#b9bfcc}
*{box-sizing:border-box}
body{margin:0;font:17px/1.6 "Inter Variable",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
.nav{background:#0f1420;padding:0 16px}
.nav a{display:block;max-width:560px;margin:0 auto;padding:18px 0;color:#fff;text-decoration:none;font:800 1.5rem "Fraunces Variable",Georgia,serif}
main{max-width:560px;margin:0 auto;padding:40px 16px 64px}
h1{font:800 clamp(2rem,6vw,2.6rem)/1.12 "Fraunces Variable",Georgia,serif;margin:0 0 .4em}
.lead{color:var(--mute);font-size:1.1rem}
.back{color:var(--teal);font-weight:600;text-decoration:none;display:inline-block;margin-bottom:20px}
form{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 18px 50px rgba(28,34,51,.10);display:grid;gap:16px}
label{font-weight:600;display:grid;gap:6px}
input[type=email],textarea{font:inherit;padding:14px;min-height:52px;border:1px solid var(--field);border-radius:12px;width:100%}
input:focus,textarea:focus{outline:3px solid var(--teal);outline-offset:1px}
.opt{display:flex;gap:10px;font-weight:400;align-items:flex-start}
.opt input{width:20px;height:20px;margin-top:3px;accent-color:var(--teal)}
.btn{background:linear-gradient(110deg,#c2255c,#e0457b 55%,#c2255c);color:#fff;border:0;border-radius:12px;min-height:52px;font:700 1.05rem "Inter Variable",sans-serif;cursor:pointer}
.btn:disabled{opacity:.6}
.hp{position:absolute;left:-9999px}
#msg{padding:14px;border-radius:12px}
#msg.err{background:var(--ribbonsoft)}#msg.ok{background:var(--tealsoft)}
</style>
</head>
<body>
<header class="nav"><a href="index.html">Nezapomeň</a></header>
<main>
 <a class="back" href="index.html">← Zpět na úvod</a>
 <h1>Odhlášení z připomínek</h1>
 <p class="lead">Mrzí mě, že odcházíš. Zadej e-mail a připomínky ti přestanou chodit.</p>
 <form id="u" novalidate>
  <label>Tvůj e-mail<input type="email" name="email" required autocomplete="email"></label>
  <div><label class="opt"><input type="radio" name="akce" value="odhlasit" checked>Odhlásit všechny připomínky a smazat údaje</label>
  <label class="opt"><input type="radio" name="akce" value="pauza">Jen pozastavit na rok, pak se zase ozvi</label></div>
  <label>Proč odcházíš? <span style="font-weight:400;color:var(--mute)">(nepovinné, moc mi to pomůže)</span><textarea name="duvod" rows="3" maxlength="500"></textarea></label>
  <input class="hp" name="web" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button class="btn" type="submit" id="go">Potvrdit</button>
  <div id="msg" role="alert" hidden></div>
 </form>
</main>
<script src="config.js"></script>
<script>
(function () {
  var cfg = window.NEZAPOMEN_CONFIG || {}, endpoint = (cfg.formEndpoint || "").trim(), contact = cfg.email || "";
  var demo = new URLSearchParams(location.search).has("demo");
  var f = document.getElementById("u"), msg = document.getElementById("msg");
  var pre = new URLSearchParams(location.search).get("e"); if (pre) f.email.value = pre;
  function show(t, k) { msg.textContent = t; msg.className = k; msg.hidden = false; }
  f.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (f.web.value) return;
    var email = f.email.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { show("Zadej prosím platný e-mail.", "err"); f.email.focus(); return; }
    if (!endpoint && !demo) { show("Odhlášení zatím není napojené. Napiš mi prosím na " + contact + " a odhlásím tě ručně.", "err"); return; }
    var data = { akce: f.akce.value, email: email, duvod: f.duvod.value.trim() };
    var btn = document.getElementById("go"); btn.disabled = true;
    try {
      if (endpoint) await fetch(endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(data) });
      f.querySelectorAll("input,textarea,button").forEach(function (el) { el.disabled = true; });
      show(data.akce === "pauza" ? "Hotovo. Na rok se odmlčím a pak se ozvu." : "Hotovo. Připomínky ti už chodit nebudou a údaje smažu do 30 dnů. Díky, že jsi to se mnou zkusil.", "ok");
    } catch (_) { btn.disabled = false; show("Nepodařilo se to odeslat. Zkus to znovu, nebo mi napiš na " + contact + ".", "err"); }
  });
})();
</script>
</body>
</html>
